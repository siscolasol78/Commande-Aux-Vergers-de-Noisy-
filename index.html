<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Commande Aux Vergers de Noisy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-green: #2d6a4f; 
            --brand-light-green: #d8f3dc; 
            --brand-dark-green: #1b4332;
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff; 
            --system-red: #ff3b30; 
            --text-dark: #1c1c1e; 
            --text-muted: #8e8e93;
            --success-green: #34c759;
        }
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--ios-bg); 
            color: var(--text-dark); 
            margin: 0; 
            padding-bottom: 140px;
            -webkit-font-smoothing: antialiased;
        }
        
        .header { 
            position: relative;
            overflow: hidden;
        }
        .header-img-wrap {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 55%;
            display: block;
        }
        .header-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(27, 67, 50, 0.0) 0%,
                rgba(27, 67, 50, 0.0) 50%,
                rgba(27, 67, 50, 0.45) 100%
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 20px 14px;
            text-align: center;
            color: white;
        }
        .header-overlay p {
            margin: 0;
            font-size: 0.95rem;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            opacity: 0.95;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
            letter-spacing: 0.02em;
        }
        
        .order-summary {
            background: white;
            border-bottom: 2px solid var(--brand-green);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brand-green);
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .summary-left { display: flex; gap: 12px; align-items: center; }
        .summary-stats { display: flex; gap: 15px; }
        .stat-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        .stat-value { font-weight: 800; font-size: 1rem; }
        
        .nav-tools {
            position: sticky; 
            top: 50px; 
            z-index: 998; 
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            padding: 10px 15px; 
            display: flex; 
            gap: 8px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.05);
        }
        .search-container { position: relative; flex: 1; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.95rem; }
        .search-box { width: 100%; padding: 8px 12px 8px 35px; border: 1px solid #e5e5ea; border-radius: 10px; background: #f2f2f7; font-size: 0.95rem; outline: none; color: var(--text-dark); }
        .search-box::placeholder { color: var(--text-muted); }
        .btn-reset-all { background: none; border: none; color: var(--system-red); font-weight: 700; cursor: pointer; font-size: 0.85rem; padding: 8px 12px; }
        
        .category-tabs {
            display: flex; gap: 8px; padding: 10px 15px;
            overflow-x: auto; background: white; border-bottom: 1px solid #e5e5ea;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .category-tab {
            background: #f2f2f7; border: 1px solid #e5e5ea;
            padding: 8px 14px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; color: var(--text-dark);
            cursor: pointer; white-space: nowrap; transition: all 0.3s ease;
        }
        .category-tab:active { transform: scale(0.95); }
        .category-tab.active { background: var(--brand-green); color: white; border-color: var(--brand-green); }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .order-info-card { 
            background: white; border-radius: 14px; padding: 15px; margin-bottom: 20px; 
            border: 2px solid var(--brand-green); box-shadow: 0 2px 8px rgba(45,106,79,0.1);
        }
        .info-title { font-weight: 800; color: var(--brand-green); margin-bottom: 12px; text-transform: uppercase; font-size: 0.9rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); text-transform: uppercase; }
        .form-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e5e5ea; font-family: inherit; font-size: 1rem; outline: none; background: #f9f9f9; }
        .form-input:focus { background: white; border-color: var(--brand-green); }
        
        .category-section { display: none; margin-bottom: 20px; }
        .category-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-title {
            font-size: 1rem; font-weight: 800; color: white;
            background: var(--brand-green); padding: 10px 14px; border-radius: 10px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .section-count { background: rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
        
        .item-card { 
            background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; transition: all 0.2s ease;
        }
        .item-card.hidden { display: none; }
        .item-card.selected { border-color: var(--success-green); background: rgba(52,199,89,0.02); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .item-name { font-weight: 700; font-size: 0.95rem; color: var(--brand-green); flex: 1; }
        .item-favorite { background: none; border: none; color: #ccc; font-size: 1.2rem; cursor: pointer; padding: 2px 6px; }
        .item-favorite.starred { color: #ffd700; }
        
        .item-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .control-section { display: flex; flex-direction: column; gap: 4px; }
        .control-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .control-buttons { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 6px; align-items: center; }
        
        .btn-control { border: none; border-radius: 6px; padding: 8px 4px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.15s ease; }
        .btn-minus { background: #e5e5ea; color: var(--text-dark); }
        .btn-minus:active { transform: scale(0.92); background: #d1d1d6; }
        .btn-plus { background: var(--brand-green); color: white; }
        .btn-plus:active { transform: scale(0.92); background: var(--brand-dark-green); }
        
        .display-value {
            text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--brand-green);
            background: var(--brand-light-green); padding: 6px 4px; border-radius: 6px;
            min-height: 24px; display: flex; align-items: center; justify-content: center;
        }
        .display-value.tappable {
            cursor: pointer;
            position: relative;
        }
        .display-value.tappable:active { background: #b7e4c7; }
        /* Input inline sur les fiches articles */
        .card-input {
            width: 100%;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--brand-green);
            background: white;
            border: 2px solid var(--brand-green);
            border-radius: 6px;
            padding: 4px 2px;
            outline: none;
            font-family: inherit;
        }
        .item-total {
            margin-top: 8px; padding-top: 8px; border-top: 0.5px dashed #e5e5ea;
            font-size: 0.8rem; font-weight: 600; color: var(--success-green);
            text-align: center; min-height: 18px;
        }
        
        .presets-section { background: white; border-radius: 12px; padding: 12px; margin-bottom: 20px; border: 1px dashed var(--brand-green); }
        .presets-title { font-weight: 700; color: var(--brand-green); margin-bottom: 10px; font-size: 0.9rem; }
        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .preset-btn { background: var(--brand-light-green); border: 1px solid var(--brand-green); color: var(--brand-green); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .preset-btn:active { background: var(--brand-green); color: white; transform: scale(0.95); }
        .preset-save-btn { background: var(--success-green); color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        
        .dock { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 2000; }
        .btn-send-order {
            width: 100%; background: linear-gradient(135deg, var(--brand-green), var(--brand-dark-green));
            color: white; border: none; padding: 16px 20px; border-radius: 16px;
            font-weight: 700; font-size: 1rem; display: flex; align-items: center;
            justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(45,106,79,0.3);
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-send-order:active { transform: scale(0.96); opacity: 0.9; }
        .counter-badge { background: rgba(255,255,255,0.3); color: white; padding: 3px 10px; border-radius: 10px; font-weight: 800; font-size: 0.9rem; }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            z-index: 3000; display: none; align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .modal-card {
            background: white; border-radius: 18px; width: 100%; max-width: 420px;
            padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.25); animation: popUp 0.3s ease-out;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-title { font-weight: 800; font-size: 1.15rem; color: var(--brand-green); margin-bottom: 15px; text-align: center; }
        
        .contact-btn {
            width: 100%; background: #f2f2f7; border: none; padding: 14px; border-radius: 12px;
            margin-bottom: 10px; font-size: 0.95rem; font-weight: 700; color: var(--text-dark);
            text-align: left; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.2s ease;
        }
        .contact-btn:active { background: var(--brand-light-green); transform: scale(0.98); }
        .contact-btn i { color: var(--success-green); font-size: 1.1rem; }
        .contact-info { display: flex; flex-direction: column; gap: 2px; }
        .contact-name { font-weight: 700; }
        .contact-location { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
        
        .btn-close-modal { width: 100%; background: transparent; border: none; padding: 12px; color: var(--system-red); font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 5px; }
        
        @keyframes popUp { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ===== PANIER AMÉLIORÉ ===== */
        .cart-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #e5e5ea;
        }
        .cart-item-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--brand-green);
            margin-bottom: 8px;
        }
        .cart-item-rows {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cart-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .cart-row-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            width: 55px;
            flex-shrink: 0;
        }
        .cart-row-label i {
            font-size: 0.85rem;
            color: var(--brand-green);
        }
        .cart-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: flex-end;
        }
        .cart-value {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--brand-green);
            min-width: 60px;
            text-align: center;
            background: var(--brand-light-green);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cart-value:active { background: #b7e4c7; }
        /* Saisie manuelle inline */
        .cart-input {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--brand-green);
            min-width: 60px;
            width: 70px;
            text-align: center;
            background: white;
            padding: 4px 6px;
            border-radius: 6px;
            border: 2px solid var(--brand-green);
            outline: none;
            font-family: inherit;
        }
        .btn-cart-ctrl {
            border: none;
            border-radius: 6px;
            width: 30px;
            height: 30px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-cart-minus { background: #e5e5ea; color: var(--text-dark); }
        .btn-cart-plus { background: var(--brand-green); color: white; }
        .cart-hint {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.1rem; }
            .container { padding: 12px; }
            .item-card { padding: 10px; }
        }
    </style>
</head>
