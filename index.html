<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Commande Aux Vergers de Noisy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-green: #2d6a4f; --brand-light-green: #d8f3dc; --ios-bg: #f2f2f7;
            --ios-card: #ffffff; --system-red: #ff3b30; --text-dark: #1c1c1e; --text-muted: #8e8e93;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--ios-bg); color: var(--text-dark); margin: 0; padding-bottom: 120px;
            -webkit-font-smoothing: antialiased;
        }
        .header { background: var(--ios-card); padding: 40px 20px 25px; text-align: center; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--brand-green); text-transform: uppercase; }
        
        /* --- RÉSUMÉ COMMANDE (NOUVEAU) --- */
        .order-summary {
            background: linear-gradient(135deg, var(--brand-green), #3d8568);
            color: white; padding: 12px 20px; margin: 10px 15px; border-radius: 14px;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.2); font-size: 0.95rem; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
        }
        .order-summary-left { display: flex; gap: 8px; align-items: center; }
        .order-summary-count { background: rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 20px; font-weight: 700; }
        
        .nav-tools {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 20px; display: flex; gap: 10px; border-bottom: 0.5px solid rgba(0,0,0,0.05);
        }
        .search-container { position: relative; flex: 1; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box { width: 100%; padding: 10px 15px 10px 40px; border: none; border-radius: 12px; background: rgba(142, 142, 147, 0.12); font-size: 1rem; outline: none; }
        .btn-reset-all { background: none; border: none; color: var(--system-red); font-weight: 600; cursor: pointer; }
        
        .container { max-width: 600px; margin: auto; padding: 15px; }
        
        /* --- SECTION COMMANDE (Infos retrait) --- */
        .order-info-card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px; border: 2px solid var(--brand-green); }
        .info-title { font-weight: 800; color: var(--brand-green); margin-bottom: 15px; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); }
        .form-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e5e5ea; font-family: inherit; font-size: 1rem; outline: none; }
        
        /* --- CATÉGORIES ACCORDÉON (NOUVEAU) --- */
        .category-section { margin-bottom: 8px; }
        .category-header {
            background: white; border-radius: 14px; padding: 14px 16px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5ea;
            transition: all 0.3s ease;
        }
        .category-header:active { background: var(--brand-light-green); }
        .category-header-left { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--brand-green); font-size: 1rem; }
        .category-count { background: var(--brand-light-green); color: var(--brand-green); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; }
        .category-toggle { color: var(--text-muted); transition: transform 0.3s ease; font-size: 1.1rem; }
        .category-section.collapsed .category-toggle { transform: rotate(-90deg); }
        
        .category-items { 
            max-height: 2000px; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }
        .category-section.collapsed .category-items { max-height: 0; opacity: 0; }
        
        /* --- ARTICLES (COMPACT) --- */
        .item-card { 
            background: var(--ios-card); border-radius: 12px; padding: 12px; margin: 8px 0; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 0.5px solid #f0f0f0;
        }
        .item-name { font-weight: 700; font-size: 0.95rem; color: var(--brand-green); margin-bottom: 8px; }
        
        /* --- CONTRÔLES EN LIGNE (COMPACT) --- */
        .control-row { 
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; 
            margin-bottom: 6px;
        }
        .row-label { 
            font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; 
            grid-column: span 3; margin-bottom: 2px;
        }
        .btn-small { 
            border: none; border-radius: 6px; padding: 6px 4px; font-weight: 700; font-size: 0.7rem; 
            cursor: pointer; transition: all 0.15s ease;
        }
        .btn-add { background: var(--brand-green); color: white; }
        .btn-add:active { transform: scale(0.95); opacity: 0.8; }
        .btn-sub { background: #e5e5ea; color: var(--text-dark); }
        .btn-sub:active { transform: scale(0.95); }
        
        .display-val { 
            text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--brand-green); 
            background: var(--brand-light-green); padding: 6px; border-radius: 6px; min-height: 24px;
        }
        .item-total { 
            margin-top: 4px; padding-top: 6px; border-top: 0.5px dashed #e5e5ea; 
            font-size: 0.8rem; font-weight: 600; color: #34c759; text-align: center; min-height: 18px;
        }
        
        /* --- DOCK COMMANDE --- */
        .dock { 
            position: fixed; bottom: 25px; left: 20px; right: 20px; z-index: 2000; 
        }
        .btn-send-order {
            width: 100%; background: var(--brand-green); color: white; border: none; padding: 20px; 
            border-radius: 20px; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; 
            justify-content: center; gap: 12px; box-shadow: 0 10px 25px rgba(45, 106, 79, 0.3); cursor: pointer;
        }
        .btn-send-order:active { transform: scale(0.98); opacity: 0.9; }
        .counter-badge { background: white; color: var(--brand-green); padding: 2px 8px; border-radius: 8px; font-weight: 800; }
        
        /* --- MODAL CONTACT --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .modal-card {
            background: white; border-radius: 20px; width: 100%; max-width: 400px; padding: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: popUp 0.2s ease-out;
        }
        .modal-title { font-weight: 800; font-size: 1.2rem; color: var(--brand-green); margin-bottom: 15px; text-align: center; }
        .contact-btn {
            width: 100%; background: #f2f2f7; border: none; padding: 15px; border-radius: 12px;
            margin-bottom: 10px; font-size: 1rem; font-weight: 700; color: var(--text-dark);
            text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }
        .contact-btn:active { background: var(--brand-light-green); }
        .contact-btn i { color: #34c759; font-size: 1.2rem; }
        .btn-close-modal {
            width: 100%; background: transparent; border: none; padding: 10px; color: var(--system-red);
            font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 5px;
        }
        
        @keyframes popUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="header">
    <i class="fa-solid fa-basket-shopping" style="color:var(--brand-green); font-size: 2.2rem; margin-bottom: 12px;"></i>
    <h1>Aux Vergers de Noisy</h1>
    <p>Préparez votre liste</p>
</div>

<!-- RÉSUMÉ COMMANDE EN TEMPS RÉEL -->
<div class="order-summary" id="orderSummary">
    <div class="order-summary-left">
        <i class="fa-solid fa-check-circle"></i>
        <span id="summaryText">0 article</span>
    </div>
    <div class="order-summary-count" id="summaryCount">0</div>
</div>

<div class="nav-tools">
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search" class="search-box" placeholder="Chercher un article..." onkeyup="filterItems()">
    </div>
    <button class="btn-reset-all" onclick="resetOrder()">Vider</button>
</div>

<div class="container">
    <div class="order-info-card">
        <div class="info-title">Infos retrait</div>
        <div class="form-group"><label>DATE</label><input type="date" id="order-date" class="form-input" onchange="saveExtraInfo()"></div>
        <div class="form-group"><label>HEURE DE PASSAGE</label><input type="time" id="order-time" class="form-input" onchange="saveExtraInfo()"></div>
        <div class="form-group"><label>COMMENTAIRE</label><textarea id="order-note" class="form-input" rows="3" oninput="saveExtraInfo()" placeholder="Variété précise, maturité, etc."></textarea></div>
    </div>
    <div id="item-list"></div>
</div>

<div class="dock">
    <button class="btn-send-order" onclick="openContactModal()">
        <i class="fa-solid fa-paper-plane"></i> Envoyer ma commande <span id="order-count" class="counter-badge">0</span>
    </button>
</div>

<div class="modal-overlay" id="contactModal">
    <div class="modal-card">
        <div class="modal-title">Destinataire du SMS</div>
        
        <button class="contact-btn" onclick="sendSMSDirect('+33777833884')">
            <span>Georges <small style="display:block; font-weight:400; color:#8e8e93">Marché de Versailles</small></span>
            <i class="fa-solid fa-comment-sms"></i>
        </button>
        
        <button class="contact-btn" onclick="sendSMSDirect('+33670419705')">
            <span>Carlos <small style="display:block; font-weight:400; color:#8e8e93">Marché de Nanterre</small></span>
            <i class="fa-solid fa-comment-sms"></i>
        </button>
        
        <button class="contact-btn" onclick="sendSMSDirect('+33666756957')">
            <span>Alexandre <small style="display:block; font-weight:400; color:#8e8e93">Marché de Noisy</small></span>
            <i class="fa-solid fa-comment-sms"></i>
        </button>
        
        <button class="btn-close-modal" onclick="closeContactModal()">Annuler</button>
    </div>
</div>

<script>
    const inventory = {
        "🍏 POMMES": ["POMME CHANTECLER", "POMME GALA", "POMME GOLDEN", "POMME GOLDRUSH", "POMME GRANNY", "POMME OPALE", "POMME PATTE DE LOUP", "POMME PINK LADY"],
        "🥬 SALADES": ["SALADE BATAVIA", "SALADE LAITUE", "SALADE FEUILLE DE CHENE", "FRISÉE", "SCAROLE", "ROUGETTE", "MACHE", "EPINARD"],
        "🥕 LÉGUMES": ["AIL", "ARTICHAUT", "AUBERGINE", "BETTERAVE", "BLETTE", "BROCOLI", "BUTTERNUT", "CAROTTE", "CAROTTE FANE", "CAROTTE SABLE", "CELERI", "CHAMPIGNON DE PARIS", "CHOU BLANC", "CHOU FLEUR", "CHOU KALE", "CHOU ROUGE", "CITROUILLE", "COURGETTE", "CRESSON", "ÉCHALOTE", "ENDIVE", "FENOUIL", "FÈVE", "GERME DE BLÉ", "GINGEMBRE", "HARICOT", "IGNAME", "LAITUE", "LENTILLE", "MAÏS", "NAVET", "OIGNON", "OIGNON BLANC", "OIGNON ROUGE", "OSEILLE", "PATATE DOUCE", "PETIT POIS", "PIMENT", "POIREAU", "POIS GOURMAND", "POIVRON", "POIVRON ROUGE", "POTIMARRON", "POTIRON", "RADIS", "RADIS NOIR", "RAIFORT", "RHUBARBE", "ROQUETTE", "RUTABAGA", "SALSIFIS", "SCORSONÈRE", "SOJA", "SOJA JAUNE", "TOMATE", "TOMATE CERISE", "TOMATE GRAPPE", "TOMATE RONDE", "TOMATE ROMA", "TRUFFE", "TURNEPS", "VANILLE"],
        "🍓 FRUITS": ["ANANAS", "AVOCAT", "BANANE", "CERISE", "CITRON", "CITRON VERT", "CLEMENTINE", "FIGUE", "FRAISE", "FRAMBOISE", "GRENADE", "KAKI", "KIWI", "MANGUE", "MELON", "ORANGE GALA", "ORANGE SANGUINE", "ORANGE VALENCE", "PAMPLEMOUSSE", "PAPAYE", "PASTÈQUE", "PÊCHE", "PÊCHE BLANCHE", "PÊCHE JAUNE", "PÊCHE PLATE", "PÊCHE ROUGE", "POIRE", "POMME", "PRUNE", "PRUNE JAUNE", "PRUNE NOIRE", "PRUNE ROUGE", "RAISIN", "RAISIN BLANC", "RAISIN ROUGE", "RAMBUTAN", "REDBOR", "REINE CLAUDE"],
        "🌿 HERBES": ["ANETH", "BASILIC", "CIBOULETTE", "CORIANDRE", "ESTRAGON", "MENTHE", "OSEILLE", "PERSIL", "THYM LAURIER"]
    };

    let order = {};
    const STORAGE_KEY = 'noisy_v6_accordeon';
    const CATEGORIES_STORAGE = 'noisy_categories_state';

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(order)); }
    function saveExtraInfo() {
        const extra = { date: document.getElementById('order-date').value, time: document.getElementById('order-time').value, note: document.getElementById('order-note').value };
        localStorage.setItem(STORAGE_KEY + '_extra', JSON.stringify(extra));
    }

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) { order = JSON.parse(saved); }
        for (const cat in inventory) {
            inventory[cat].forEach(name => { if (!order[name]) order[name] = { weight: 0, piece: 0 }; });
        }
        const savedExtra = localStorage.getItem(STORAGE_KEY + '_extra');
        if (savedExtra) {
            const extra = JSON.parse(savedExtra);
            document.getElementById('order-date').value = extra.date || '';
            document.getElementById('order-time').value = extra.time || '';
            document.getElementById('order-note').value = extra.note || '';
        }
    }

    function getCategoryState() {
        const saved = localStorage.getItem(CATEGORIES_STORAGE);
        return saved ? JSON.parse(saved) : {};
    }

    function saveCategoryState(state) {
        localStorage.setItem(CATEGORIES_STORAGE, JSON.stringify(state));
    }

    function toggleCategory(categoryName) {
        const section = document.getElementById(`cat-${categoryName}`);
        const state = getCategoryState();
        const isCollapsed = section.classList.toggle('collapsed');
        state[categoryName] = isCollapsed;
        saveCategoryState(state);
    }

    function init() {
        loadData();
        const listEl = document.getElementById('item-list');
        const categoryState = getCategoryState();

        for (const category in inventory) {
            const categorySection = document.createElement('div');
            categorySection.className = 'category-section';
            if (categoryState[category]) categorySection.classList.add('collapsed');
            categorySection.id = `cat-${category}`;

            // Compter les articles de la catégorie
            const itemCount = inventory[category].length;

            const categoryHeader = document.createElement('div');
            categoryHeader.className = 'category-header';
            categoryHeader.onclick = () => toggleCategory(category);
            categoryHeader.innerHTML = `
                <div class="category-header-left">
                    <span>${category}</span>
                    <div class="category-count">${itemCount}</div>
                </div>
                <div class="category-toggle"><i class="fa-solid fa-chevron-down"></i></div>
            `;

            const categoryItems = document.createElement('div');
            categoryItems.className = 'category-items';

            inventory[category].forEach((name) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-name">${name}</div>
                    <div class="row-label">Poids</div>
                    <div class="control-row">
                        <button class="btn-small btn-sub" onclick="updateQty('${name}', 'weight', -1)">-1kg</button>
                        <div class="display-val" id="w-${name}">0 kg</div>
                        <button class="btn-small btn-add" onclick="updateQty('${name}', 'weight', 1)">+1kg</button>
                    </div>
                    <div class="row-label">Unité</div>
                    <div class="control-row">
                        <button class="btn-small btn-sub" style="height:32px; padding:5px 4px;" onclick="updateQty('${name}', 'piece', -1)">-1</button>
                        <div class="display-val" id="p-${name}">0 pce</div>
                        <button class="btn-small btn-add" style="height:32px; padding:5px 4px;" onclick="updateQty('${name}', 'piece', 1)">+1</button>
                    </div>
                    <div class="item-total" id="total-${name}"></div>
                `;
                categoryItems.appendChild(card);
                refreshCard(name);
            });

            categorySection.appendChild(categoryHeader);
            categorySection.appendChild(categoryItems);
            listEl.appendChild(categorySection);
        }
        updateBadge();
    }

    function updateQty(name, type, delta) {
        order[name][type] = Math.max(0, parseFloat((order[name][type] + delta).toFixed(1)));
        refreshCard(name); saveData(); updateBadge();
    }

    function refreshCard(name) {
        const item = order[name];
        const wDisp = document.getElementById(`w-${name}`);
        wDisp.innerText = item.weight >= 1 ? item.weight + " kg" : (item.weight > 0 ? (item.weight * 1000) + " g" : "0 kg");
        document.getElementById(`p-${name}`).innerText = item.piece + " pce";
        let summary = [];
        if(item.weight > 0) summary.push(wDisp.innerText);
        if(item.piece > 0) summary.push(item.piece + " pce");
        document.getElementById(`total-${name}`).innerText = summary.length > 0 ? "✓ " + summary.join(" + ") : "";
    }

    function updateBadge() {
        let count = 0;
        let totalWeight = 0;
        let totalPieces = 0;

        for (let name in order) { 
            if(order[name].weight > 0 || order[name].piece > 0) {
                count++;
                totalWeight += order[name].weight;
                totalPieces += order[name].piece;
            }
        }

        document.getElementById('order-count').innerText = count;

        // Mise à jour du résumé en temps réel
        let summaryText = '';
        if (count === 0) {
            summaryText = '0 article';
        } else if (count === 1) {
            summaryText = '1 article sélectionné';
        } else {
            summaryText = `${count} articles sélectionnés`;
        }

        let details = [];
        if (totalWeight > 0) details.push(totalWeight >= 1 ? totalWeight.toFixed(1) + " kg" : (totalWeight * 1000).toFixed(0) + " g");
        if (totalPieces > 0) details.push(totalPieces + " pce");

        if (details.length > 0) {
            summaryText += ' • ' + details.join(' + ');
        }

        document.getElementById('summaryText').innerText = summaryText;
        document.getElementById('summaryCount').innerText = count > 0 ? count : '—';
    }

    function resetOrder() {
        if(confirm("Tout effacer ?")) {
            localStorage.removeItem(STORAGE_KEY); 
            localStorage.removeItem(STORAGE_KEY + '_extra');
            for(let name in order) { order[name].weight = 0; order[name].piece = 0; refreshCard(name); }
            document.getElementById('order-date').value = ''; 
            document.getElementById('order-time').value = ''; 
            document.getElementById('order-note').value = '';
            updateBadge();
        }
    }

    function filterItems() {
        let q = document.getElementById('search').value.toLowerCase();
        let cards = document.getElementsByClassName('item-card');
        Array.from(cards).forEach(card => {
            let name = card.querySelector('.item-name').innerText.toLowerCase();
            card.style.display = name.includes(q) ? 'block' : 'none';
        });
    }

    function buildOrderText() {
        const d = document.getElementById('order-date').value, t = document.getElementById('order-time').value, n = document.getElementById('order-note').value;
        let text = `🛒 COMMANDE NOISY\n📅 ${d || '?'}\n⏰ ${t || '?'}\n${n ? '📝 '+n+'\n' : ''}`;
        let hasData = false;
        for (const cat in inventory) {
            let catText = "";
            inventory[cat].forEach(name => {
                const item = order[name];
                if (item.weight > 0 || item.piece > 0) {
                    let parts = [];
                    if(item.weight > 0) parts.push(item.weight >= 1 ? item.weight + "kg" : (item.weight*1000) + "g");
                    if(item.piece > 0) parts.push(item.piece + "pce");
                    catText += `\n✅ ${name} : ${parts.join(" + ")}`;
                    hasData = true;
                }
            });
            if(catText) text += `\n${cat}${catText}\n`;
        }
        return { text, hasData };
    }

    function openContactModal() {
        const { hasData } = buildOrderText();
        if (!hasData) return alert("Panier vide !");
        document.getElementById('contactModal').style.display = 'flex';
    }

    function closeContactModal() {
        document.getElementById('contactModal').style.display = 'none';
    }

    function sendSMSDirect(phoneNumber) {
        const { text } = buildOrderText();
        closeContactModal();

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const separator = isIOS ? '&' : '?';
        const smsUrl = `sms:${phoneNumber}${separator}body=${encodeURIComponent(text)}`;
        
        window.location.href = smsUrl;
    }

    init();
</script>
</body>
</html>
